[package]
name = "horo-ui"
description = "horo's gpui interface: theme, views, and the bridge from horo-core's events into gpui state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[dependencies]
imagesize = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "webp", "gif"] }
url.workspace = true
# Installing a release over this install (see src/updater.rs).
cargo-packager-updater = "0.2.3"
semver = "1"
horo-core.workspace = true
matrix-sdk.workspace = true
# gpui-component 0.10 is built on `gpui-pre`, a republished Zed snapshot
# (docs/spikes/gpui-desktop.md on the spike branch); both pinned together.
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-component = "0.10"
# Its text selection, for selectable message text (views/selectable.rs).
gpui-base = "0.10"
# The icons gpui-component draws (Lucide), embedded; the app registers them.
gpui-kit-assets = "0.10"
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
# Message times in the local timezone.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde.workspace = true
serde_json.workspace = true
# The speaker the notification sounds play through (and, later, calls).
horo-rtc = { workspace = true, features = ["media"] }
# Native banners: Notification Center, the Windows toast, the freedesktop
# notification service. The same version the Tauri shell's plugin uses.
notify-rust = "4.18"

# Video played in the timeline: AVFoundation decodes it and plays its
# sound; its frames come back as CVPixelBuffers, which gpui draws with its
# `surface` element. macOS only, as that element is.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-video = "0.3"
objc2-core-media = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media", "objc2-core-video", "block2", "dispatch2"] }
block2 = "0.6"
dispatch2 = "0.3"
# Banners that open their room when clicked.
objc2-user-notifications = { version = "0.3", features = ["block2"] }
# Screen sharing.
objc2-screen-capture-kit = { version = "0.3", features = ["block2", "dispatch2", "objc2-core-media", "objc2-core-graphics"] }

# Cameras and screen sharing on Linux go through PipeWire: cameras are its
# video sources, and a shared screen is a stream the desktop portal's
# ScreenCast hands over. ashpd on async-io, as gpui's Linux backend has it
# (its tokio and async-io features can't both be on).
[target.'cfg(target_os = "linux")'.dependencies]
# 0.8 supports PipeWire 1.0+ (Ubuntu 24.04) through 1.6+ (Arch); 0.9 requires
# libpipewire >= 1.2 headers which Ubuntu 24.04 CI runners do not ship.
pipewire = "0.8"
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screencast"] }
# Closing a portal session when sharing stops, from wherever that happens.
futures-lite = "2"
