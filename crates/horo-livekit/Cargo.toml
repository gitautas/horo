[package]
name = "horo-livekit"
description = "LiveKit signalling for horo: join, negotiate, trickle, publish, keep alive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[dependencies]
# The LiveKit protocol's message types, generated from its protobufs.
livekit-protocol = "0.8"
prost = "0.14"
tokio.workspace = true
# webpki roots rather than the OS store: the same behaviour on every
# platform, phones included, where rustls-native-certs has gaps.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
jsonwebtoken = "9"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
