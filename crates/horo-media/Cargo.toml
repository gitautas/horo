[package]
name = "horo-media"
description = "horo's media engine: WebRTC peer connections over str0m, ICE (UDP, TCP, TURN), and the audio path"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[dependencies]
# Sans-I/O WebRTC. aws-lc-rs is the crypto horo already uses for rustls, so
# there is no OpenSSL to build for iOS/Android (Phase 0).
str0m = { version = "0.25", default-features = false, features = ["aws-lc-rs"] }
tokio = { workspace = true, features = ["net", "io-util"] }
thiserror.workspace = true
tracing.workspace = true
rand = "0.9"
# TURN's long-term credentials.
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"
# TURN over TLS.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
webpki-roots = "1"

# Speech codec: libopus, bundled and built with cmake.
opus = "0.4"

[dev-dependencies]
horo-livekit.workspace = true
horo-devices.workspace = true
jsonwebtoken = "9"
serde.workspace = true
