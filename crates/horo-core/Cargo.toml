[package]
name = "horo-core"
description = "horo's Matrix layer: sessions, rooms, timelines, spaces, presence, packs, verification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[dependencies]
matrix-sdk.workspace = true
matrix-sdk-ui.workspace = true
matrix-sdk-base.workspace = true
tokio.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
reqwest.workspace = true
rand = "0.9"
mime = "0.3"
mime_guess = "2"

# `v1` (the default) picks the right native store per platform: Keychain on
# macOS, Credential Manager on Windows, Secret Service on *nix.
keyring = "4"

# `keyring`'s `v1` API — the layer that picks a store per platform — excludes
# iOS by design: its `set_credential_store` returns `Invalid("platform", ..)`
# there, and `apple-native-keyring-store` refuses to compile for iOS at all
# unless the `protected` feature is on, which `v1` never enables. So iOS
# registers the data-protection keychain itself (see `session.rs`). Cargo
# unifies features across the graph, so naming `protected` here also switches
# it on inside `keyring`'s own copy of the store, which is what clears the
# `compile_error!`.
[target.'cfg(target_os = "ios")'.dependencies]
keyring-core = "1"
apple-native-keyring-store = { version = "1", features = ["protected"] }

[dev-dependencies]
tempfile = "3"
