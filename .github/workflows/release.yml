name: Release

# The gpui desktop app, packaged by cargo-packager, plus the `latest.json` that
# installed copies poll. The manifest also serves installs of the old Tauri
# app: same signing key, same address, and each macOS entry listed under both
# updaters' platform names, so those installs update straight into this one.

on:
  push:
    tags: ['v*']
  # Manual runs build the full matrix and attach bundles as run artifacts.
  # No release is created or touched.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never kill a release run mid-upload

jobs:
  create-release:
    # Tag pushes only; workflow_dispatch runs are build-only.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7

      # The root Cargo.toml's [workspace.package] is the single source of truth
      # for the app version; cargo-packager reads it from there.
      - name: Check tag matches app version
        run: |
          VERSION="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${VERSION} (expected v${VERSION}). Bump the version in Cargo.toml, or fix the tag."
            exit 1
          fi

      # Without it the packager silently skips the .sig files, and the manifest
      # step at the end would fail after an hour of building. Refuse early.
      - name: Check the updater signing secret exists
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${SIGNING_KEY}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set — see docs/releasing.md. Without it the release cannot feed the in-app updater."
            exit 1
          fi

      # Idempotent: re-running a failed release run reuses the draft it already
      # made instead of failing on the duplicate tag. Draft releases are
      # invisible to /releases/tags/{tag}, so the lookup scans the list.
      - name: Create or reuse draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"${GITHUB_REF_NAME}\") | .id" | head -n1)"

          if [ -n "${release_id}" ]; then
            echo "Reusing existing release ${release_id} for ${GITHUB_REF_NAME}"
          else
            release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="${GITHUB_REF_NAME}" \
              -f name="horo ${GITHUB_REF_NAME}" \
              -F draft=true \
              -F body=@.github/release-notes.md \
              --jq '.id')"
          fi

          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    # Run when create-release succeeded (tag push) OR when it was skipped
    # because this is a manual build-only run. Never after a failure.
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false   # one platform's flake must not kill the other rows
      matrix:
        include:
          - name: macos-aarch64
            platform: macos-latest          # arm64 image
            target: aarch64-apple-darwin
            arch: aarch64
            formats: app,dmg
          - name: macos-x86_64
            platform: macos-latest          # Intel, cross-compiled on arm64
            target: x86_64-apple-darwin
            arch: x86_64
            formats: app,dmg
          - name: linux-x86_64
            platform: ubuntu-22.04          # glibc 2.35 baseline (Ubuntu 22.04 / Debian 12+)
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            formats: deb,appimage
          - name: linux-aarch64
            platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            arch: aarch64
            formats: deb,appimage
          - name: windows-x86_64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x86_64
            # NSIS only: it installs per user, so an update needs no elevation
            # prompt the app can't answer (the Tauri releases' updates used it
            # too; their MSI is gone).
            formats: nsis
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        # horo-rtc builds libvpx from third_party/libvpx.
        with:
          submodules: true

      # What gpui (a display server's keyboard maps, Vulkan, fonts), calls
      # (ALSA, libvpx's assembly) and the keyring (D-Bus) build against.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config nasm cmake file \
            libasound2-dev libdbus-1-dev libssl-dev libzstd-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev \
            libfontconfig1-dev libfreetype6-dev

      # libvpx's Windows build: configure and `make dist` under Git's bash,
      # nasm for its assembly, then MSBuild (crates/horo-rtc/build.rs).
      - name: Install libvpx build tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm make -y --no-progress
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      # The Intel Mac row cross-builds libvpx with its x86 assembly
      # (`--as=nasm` in crates/horo-rtc/build.rs); the runner has no nasm.
      - name: Install libvpx build tools (Intel macOS)
        if: matrix.target == 'x86_64-apple-darwin'
        run: brew install nasm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}   # per-row caches; rows must never share entries
          # Tag-ref caches can't be restored by future tags, but main-branch
          # caches can be restored by every ref. Save only on branch runs.
          save-if: ${{ github.ref_type == 'branch' }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8

      - name: Build
        env:
          # Windows x64: aws-lc-sys (matrix-sdk -> reqwest -> rustls) needs
          # NASM objects; use AWS's prebuilt, CI-verified ones.
          AWS_LC_SYS_PREBUILT_NASM: '1'
        run: cargo build --release --locked -p horo-desktop --target ${{ matrix.target }}

      - name: Package
        env:
          # The trust root for every update anyone ever gets: with it the
          # packager also writes the updater's archive (.app.tar.gz on macOS)
          # and a detached .sig beside each package, which the app checks
          # against horo_core::update::PUBKEY before installing anything.
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy is itself an AppImage; runners have no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          cargo packager --release -p horo-desktop \
            --target ${{ matrix.target }} --formats ${{ matrix.formats }}

      # Everything to publish, under names that can't collide across rows:
      # the packager calls both Macs' archives `horo.app.tar.gz`.
      - name: Collect the bundles
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)"
          out="$(cargo metadata --format-version 1 --no-deps | jq -r .target_directory)/${{ matrix.target }}/release"
          mkdir -p dist-release
          shopt -s nullglob
          for f in "$out"/*.dmg "$out"/*.deb "$out"/*.AppImage "$out"/*-setup.exe \
                   "$out"/*.AppImage.sig "$out"/*-setup.exe.sig; do
            cp "$f" dist-release/
          done
          if [ -f "$out/horo.app.tar.gz" ]; then
            cp "$out/horo.app.tar.gz" "dist-release/horo_${version}_${{ matrix.arch }}.app.tar.gz"
            cp "$out/horo.app.tar.gz.sig" "dist-release/horo_${version}_${{ matrix.arch }}.app.tar.gz.sig"
          fi
          ls -la dist-release
          [ -n "$(ls dist-release)" ] || { echo "::error::this row packaged nothing"; exit 1; }

      - name: Attach to the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist-release/* --clobber

      - name: Upload bundles as run artifacts (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: horo-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 7          # private-repo artifact storage is billed
          path: dist-release/*

  publish:
    needs: [create-release, build]
    if: ${{ !cancelled() && github.event_name == 'push'
            && needs.create-release.result == 'success'
            && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check every platform's assets are attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate \
            --jq '.[].name' | sort > assets.txt
          cat assets.txt

          # One regex per bundle the matrix is expected to produce.
          missing=0
          for want in '_aarch64\.dmg$' '_x64\.dmg$' \
                      '_aarch64\.app\.tar\.gz$' '_x86_64\.app\.tar\.gz$' \
                      '_amd64\.deb$' '_arm64\.deb$' \
                      '_(amd64|x86_64)\.AppImage$' '_(arm64|aarch64)\.AppImage$' \
                      '_x64-setup\.exe$'; do
            if ! grep -qiE -- "${want}" assets.txt; then
              echo "::error::No release asset matched /${want}/"
              missing=1
            fi
          done
          [ "${missing}" -eq 0 ]

      # ------------------------------------------------------------------------
      # The updater manifest, built from the assets actually attached: a
      # platform whose build flaked can't end up in it, and no entry can point
      # at an asset that isn't there. Written once, here, rather than by each
      # build row, because parallel read-modify-writes of one asset lose
      # entries.
      #
      # Two updaters read it. The gpui app's (cargo-packager-updater) keys
      # platforms `macos-*`, `linux-*`, `windows-*` and needs `format`; the old
      # Tauri app's keys macOS as `darwin-*` and ignores `format`. Linux and
      # Windows keys are spelled alike, so only macOS is listed twice.
      #
      # Only these bundle kinds can update in place. A .deb is installed by
      # something that isn't us, and the app sends those users to the release.
      # ------------------------------------------------------------------------
      - name: Build the updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

          # id and name together: a .sig has to be fetched through the API by
          # id, because a draft release's assets aren't downloadable yet.
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate \
            --jq '.[] | [.id, .name] | @tsv' > assets.tsv

          # Release notes travel with the manifest so the app can show what
          # changed without a second request.
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.body' > notes.txt

          platforms='{}'
          while IFS='	' read -r keys format pattern; do
            name="$(grep -iE -- "${pattern}" <(cut -f2 assets.tsv) | head -n1 || true)"
            if [ -z "${name}" ]; then
              echo "::error::No updater bundle for ${keys} matched /${pattern}/"
              exit 1
            fi

            sig_id="$(awk -F'\t' -v n="${name}.sig" '$2 == n { print $1 }' assets.tsv | head -n1)"
            if [ -z "${sig_id}" ]; then
              echo "::error::${name} was uploaded without its ${name}.sig — the build ran without TAURI_SIGNING_PRIVATE_KEY."
              exit 1
            fi

            signature="$(gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${sig_id}" \
              -H 'Accept: application/octet-stream')"

            for key in ${keys//,/ }; do
              platforms="$(jq -n --argjson p "${platforms}" --arg k "${key}" \
                --arg url "${base}/${name}" --arg sig "${signature}" --arg format "${format}" \
                '$p + { ($k): { signature: $sig, url: $url, format: $format } }')"
              echo "${key} -> ${name} (${format})"
            done
          done <<'TARGETS'
          macos-aarch64,darwin-aarch64	app	_aarch64\.app\.tar\.gz$
          macos-x86_64,darwin-x86_64	app	_x86_64\.app\.tar\.gz$
          linux-x86_64	appimage	_(amd64|x86_64)\.AppImage$
          linux-aarch64	appimage	_(arm64|aarch64)\.AppImage$
          windows-x86_64	nsis	_x64-setup\.exe$
          TARGETS

          jq -n --arg version "${version}" --rawfile notes notes.txt \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "${platforms}" \
            '{ version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms }' \
            > latest.json

          cat latest.json

      # Uploaded before the release leaves draft, so `/releases/latest/download/
      # latest.json` — what every installed app polls — never resolves to a
      # release whose manifest hasn't landed. `--repo` because this job never
      # checks the repository out, and `gh release upload` otherwise infers
      # its target from a git remote that isn't there.
      - name: Attach the manifest to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" latest.json \
            --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            -f make_latest=true \
            --jq '.html_url'
