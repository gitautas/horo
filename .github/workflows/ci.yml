name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # Exactly what `tauri build` runs as beforeBuildCommand (tsc -b && vite build),
      # so a tag build can't be broken by a frontend error CI never saw.
      - run: npm run build

      - run: npm test

  # The Linux WebView needs code no other platform compiles (see
  # `src-tauri/src/webrtc.rs`), and until this job existed the only thing that
  # ever built it was a release tag — the worst place to find a typo. Clippy
  # type-checks the whole crate, so it catches that and reads the code too;
  # warnings are left non-fatal on purpose, since the crate has some already.
  rust:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev pkg-config patchelf xdg-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> src-tauri/target'
          key: ci-linux

      # `tauri::generate_context!` reads ../dist, which no frontend build has
      # produced here. An empty index.html is all it asks for.
      - run: mkdir -p dist && touch dist/index.html

      - run: cargo clippy --workspace --all-targets

      # Unit tests for every crate, plus horo-core's integration tests against
      # a throwaway Synapse (crates/horo-core/tests/homeserver.rs). Those skip
      # themselves without HORO_TEST_HOMESERVER locally, but fail in CI.
      - name: Start test homeserver
        run: scripts/test-homeserver/start.sh

      - name: Test
        env:
          HORO_TEST_HOMESERVER: http://localhost:8008
        run: cargo test --workspace

      - name: Homeserver log
        if: failure()
        run: docker logs horo-test-synapse 2>&1 | tail -200

      # src/lib/bindings is generated from the Rust wire types and committed, so
      # the frontend build never needs cargo. That only holds while nobody
      # forgets `npm run bindings` after changing one; regenerate here and fail
      # on any difference, including a file that should no longer exist.
      - name: Check TypeScript bindings are current
        run: |
          node scripts/bindings.mjs
          if [ -n "$(git status --porcelain -- src/lib/bindings)" ]; then
            git status --short -- src/lib/bindings
            echo "::error::src/lib/bindings is out of date — run \`npm run bindings\` and commit the result"
            exit 1
          fi
