name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # Exactly what `tauri build` runs as beforeBuildCommand (tsc -b && vite build),
      # so a tag build can't be broken by a frontend error CI never saw.
      - run: npm run build

      - run: npm test

  # The voice engine on the other two desktops: it has to build and pass its
  # unit tests there (cpal on WASAPI and CoreAudio, libopus and aws-lc built
  # with each platform's toolchain, sonora, str0m). The tests that need a
  # LiveKit server run in the Linux job; these runners have no Docker.
  voice:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> src-tauri/target'
          key: ci-voice-${{ matrix.os }}

      - run: cargo clippy -p horo-livekit -p horo-media -p horo-devices -p horo-call --all-targets

      - run: cargo test -p horo-livekit -p horo-media -p horo-devices -p horo-call --lib

      # The CLI as a user would build it.
      - run: cargo build -p horo-call --bin horo-call

  # The Linux WebView needs code no other platform compiles (see
  # `src-tauri/src/webrtc.rs`), and until this job existed the only thing that
  # ever built it was a release tag — the worst place to find a typo. Clippy
  # type-checks the whole crate, so it catches that and reads the code too;
  # warnings are left non-fatal on purpose, since the crate has some already.
  rust:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev pkg-config patchelf xdg-utils \
            libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> src-tauri/target'
          key: ci-linux

      # `tauri::generate_context!` reads ../dist, which no frontend build has
      # produced here. An empty index.html is all it asks for.
      - run: mkdir -p dist && touch dist/index.html

      - run: cargo clippy --workspace --all-targets

      # Unit tests for every crate, plus horo-core's integration tests against
      # a throwaway Synapse (crates/horo-core/tests/homeserver.rs). Those skip
      # themselves without HORO_TEST_HOMESERVER locally, but fail in CI.
      - name: Start test homeserver
        run: scripts/test-homeserver/start.sh

      # horo-livekit's signal client against a real SFU
      # (crates/horo-livekit/tests/livekit.rs).
      - name: Start test LiveKit server
        run: scripts/test-livekit/start.sh

      # A second LiveKit with its TURN server on, for horo-media's relayed
      # calls. It prints the env the tests read; GITHUB_ENV wants one per line.
      - name: Start test LiveKit server with TURN
        # `shell: bash` adds pipefail, so a failed start isn't hidden by the pipe.
        shell: bash
        run: scripts/test-livekit/start-turn.sh | sed 's/^export //' | tr ' ' '\n' >> "$GITHUB_ENV"

      - name: Test
        env:
          HORO_TEST_HOMESERVER: http://localhost:8008
          HORO_TEST_LIVEKIT: ws://127.0.0.1:7880
        run: cargo test --workspace

      - name: Homeserver log
        if: failure()
        run: docker logs horo-test-synapse 2>&1 | tail -200

      - name: LiveKit log
        if: failure()
        run: |
          docker logs horo-test-livekit 2>&1 | tail -100
          docker logs horo-test-livekit-turn 2>&1 | tail -100

      # src/lib/bindings is generated from the Rust wire types and committed, so
      # the frontend build never needs cargo. That only holds while nobody
      # forgets `npm run bindings` after changing one; regenerate here and fail
      # on any difference, including a file that should no longer exist.
      - name: Check TypeScript bindings are current
        run: |
          node scripts/bindings.mjs
          if [ -n "$(git status --porcelain -- src/lib/bindings)" ]; then
            git status --short -- src/lib/bindings
            echo "::error::src/lib/bindings is out of date — run \`npm run bindings\` and commit the result"
            exit 1
          fi
