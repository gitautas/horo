name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The voice engine on the other two desktops: it has to build and pass its
  # unit tests there (cpal on WASAPI and CoreAudio, libopus and aws-lc built
  # with each platform's toolchain, sonora, str0m). The tests that need a
  # LiveKit server run in the Linux job; these runners have no Docker.
  voice:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        # horo-rtc builds libvpx from third_party/libvpx.
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          key: ci-voice-${{ matrix.os }}

      # libvpx's Windows build: configure and `make dist` under MSYS2's bash +
      # make, nasm for its assembly, then MSBuild (crates/horo-rtc/build.rs).
      - name: Install libvpx build tools (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nasm -y --no-progress
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed make diffutils perl

      - run: cargo clippy -p horo-rtc --all-targets

      - run: cargo test -p horo-rtc --lib

      # The CLI as a user would build it.
      - run: cargo build -p horo-rtc --bin horo-call

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        # horo-rtc builds libvpx from third_party/libvpx.
        with:
          submodules: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config nasm cmake file \
            libasound2-dev libdbus-1-dev libssl-dev libzstd-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev \
            libfontconfig1-dev libfreetype6-dev \
            libpipewire-0.3-dev libclang-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          key: ci-linux

      - run: cargo clippy --workspace --all-targets

      # Unit tests for every crate, plus horo-core's integration tests against
      # a throwaway Synapse (crates/horo-core/tests/homeserver.rs). Those skip
      # themselves without HORO_TEST_HOMESERVER locally, but fail in CI.
      - name: Start test homeserver
        run: scripts/test-homeserver/start.sh

      # horo-rtc's LiveKit signal client against a real SFU
      # (crates/horo-rtc/tests/livekit.rs).
      - name: Start test LiveKit server
        run: scripts/test-livekit/start.sh

      # A second LiveKit with its TURN server on, for horo-rtc's relayed
      # calls. It prints the env the tests read; GITHUB_ENV wants one per line.
      - name: Start test LiveKit server with TURN
        # `shell: bash` adds pipefail, so a failed start isn't hidden by the pipe.
        shell: bash
        run: scripts/test-livekit/start-turn.sh | sed 's/^export //' | tr ' ' '\n' >> "$GITHUB_ENV"

      - name: Test
        env:
          HORO_TEST_HOMESERVER: http://localhost:8008
          HORO_TEST_LIVEKIT: ws://127.0.0.1:7880
        run: cargo test --workspace

      - name: Homeserver log
        if: failure()
        run: docker logs horo-test-synapse 2>&1 | tail -200

      - name: LiveKit log
        if: failure()
        run: |
          docker logs horo-test-livekit 2>&1 | tail -100
          docker logs horo-test-livekit-turn 2>&1 | tail -100
