<!doctype html>
<!-- The default theme, so the first paint is right before settings load. -->
<html lang="en" data-theme="horo">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` lets the page reach under the notch and home
      indicator, which is what makes `env(safe-area-inset-*)` non-zero.
      `maximum-scale` stops iOS zooming the whole shell when a text field
      focuses — a chat app's composer would otherwise shove the layout
      sideways on every tap. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0"
    />
    <meta name="color-scheme" content="dark" />
    <title>horo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
