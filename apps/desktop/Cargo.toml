[package]
name = "horo-desktop"
description = "horo on the desktop, in gpui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "horo"
path = "src/main.rs"

# Installers and the updater's archives: `cargo build --release -p
# horo-desktop`, then `cargo packager --release -p horo-desktop` (add
# `--target <triple>` to both to cross-build; see docs/releasing.md).
# The identifier is the Tauri app's, so an install updated from it keeps
# its data, keychain entry and notification permission.
[package.metadata.packager]
product-name = "horo"
identifier = "lt.uwu.uwum"
description = "a cute matrix client"
long-description = "horo — a Matrix client with end-to-end encryption and LiveKit voice, in the UwU design system."
homepage = "https://github.com/gitautas/horo"
# What the Tauri installer called the manufacturer (it had no publisher, so
# the identifier's second part): the NSIS installer files the install under
# HKCU\Software\<publisher>\horo, and matching it lets an update find a
# Tauri install wherever the user put it, and leaves no stale key behind.
publisher = "uwu"
category = "SocialNetworking"
icons = [
  "packaging/icons/32x32.png",
  "packaging/icons/128x128.png",
  "packaging/icons/128x128@2x.png",
  "packaging/icons/icon.icns",
  "packaging/icons/icon.ico",
]

[[package.metadata.packager.binaries]]
path = "horo"
main = true

[package.metadata.packager.macos]
minimum-system-version = "11.0"
# Ad hoc: there's no Developer ID. Signing at all is what embeds the
# entitlements (the microphone, under the hardened runtime) and spares
# Apple Silicon downloads Gatekeeper's "horo is damaged" dead end.
signing-identity = "-"
info-plist-path = "packaging/Info.plist"
entitlements = "packaging/entitlements.plist"

[package.metadata.packager.nsis]
# Per user, in %LOCALAPPDATA%, as the Tauri installer did: no admin prompt,
# and an update from that install lands in the same place.
installer-mode = "currentUser"

# What the binary loads at run time: a display server's keyboard maps,
# Vulkan for drawing, fonts, ALSA for calls, D-Bus for notifications.
[package.metadata.packager.deb]
depends = [
  "libasound2t64 | libasound2",
  "libxkbcommon0",
  "libxkbcommon-x11-0",
  "libwayland-client0",
  "libxcb1",
  "libvulkan1",
  "libfontconfig1",
  "libdbus-1-3",
  "xdg-desktop-portal",
]

[dependencies]
horo-ui = { path = "../../crates/horo-ui" }
horo-core.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.12" }
# Shaders compile at startup (Xcode 27 has no offline Metal compiler), and
# font-kit is what renders text on macOS at all.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["runtime_shaders", "font-kit"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

# The display servers gpui connects to on Linux. gpui-pre-platform pulls in
# its Linux backend without default features, so without these it has no
# Wayland or X11 client and the app starts headless: running, no window.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["wayland", "x11"] }
