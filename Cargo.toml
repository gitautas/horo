# One workspace for every Rust crate in the app.
#
# `horo-core` is the Matrix layer, `horo-rtc` is calls (MatrixRTC, LiveKit,
# media), `horo-ui` is the gpui interface, and `apps/desktop` is the binary.
[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.11.0"
edition = "2024"
rust-version = "1.93"
authors = ["horo"]

[workspace.dependencies]
horo-core = { path = "crates/horo-core" }
# Without `media` and `cli`: the Tauri shell only needs the MatrixRTC part.
horo-rtc = { path = "crates/horo-rtc", default-features = false }

matrix-sdk = { version = "0.18", default-features = false, features = [
  "e2e-encryption",
  "automatic-room-key-forwarding",
  "sqlite",
  "bundled-sqlite",
  "markdown",
  "sso-login",
  "qrcode",
] }
# Timeline aggregation (edits/reactions/replies), sliding-sync room list, and
# spaces — the same layer Element X is built on.
matrix-sdk-ui = { version = "0.18", default-features = false }
# For the few base types matrix-sdk doesn't re-export (LatestEventValue).
matrix-sdk-base = { version = "0.18", default-features = false }
# `ruma` and `eyeball_im` come from the SDK's own re-exports (matrix_sdk::ruma,
# matrix_sdk_ui::eyeball_im) so their versions can never drift out of sync.

tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs"] }
futures-util = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

anyhow = "1"
thiserror = "2"
tracing = "0.1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Profiles only take effect at the workspace root.

# Dependencies optimised even in dev builds. Unoptimised gpui (its layout
# engine above all) can't hold a frame rate while scrolling. No debug info for
# dependencies: it's most of the target directory's size, and the disk is tight.
# Workspace crates stay at opt-level 0 with line tables only so UI edits
# rebuild quickly; `horo-rtc` gets opt-level 1 so real-time audio/video stays
# smooth in dev builds.
[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package.horo-rtc]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
